<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        width: 300px;
        padding: 20px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 15px 0;
        color: #333;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .logo {
        width: 32px;
        height: 32px;
      }
      .version {
        font-size: 10px;
        color: #999;
        font-weight: normal;
        margin-inline-start: auto;
      }
      .copyright {
        margin-top: 15px;
        font-size: 10px;
        color: #999;
        text-align: center;
      }
      .copyright a {
        color: #666;
        text-decoration: underline;
      }
      .copyright a:hover {
        color: #2196f3;
      }
      button {
        width: 100%;
        padding: 12px;
        background: #4caf50;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 14px;
        cursor: pointer;
        transition: background 0.3s;
      }
      button:hover {
        background: #45a049;
      }
      button:active {
        background: #3d8b40;
      }
      button:disabled {
        background: #ccc;
        cursor: not-allowed;
      }
      .info {
        margin-top: 15px;
        font-size: 12px;
        color: #666;
        line-height: 1.5;
      }
      .badge {
        display: inline-block;
        background: #2196f3;
        color: white;
        padding: 2px 8px;
        border-radius: 10px;
        font-size: 10px;
        font-weight: bold;
        margin-bottom: 10px;
      }
      .rating-prompt {
        margin-top: 15px;
        padding: 10px 12px;
        background: #f5f7fa;
        border: 1px solid #e1e5eb;
        border-radius: 6px;
        position: relative;
        font-size: 12px;
        color: #444;
      }
      .rating-prompt[hidden] {
        display: none;
      }
      .rating-prompt .rp-title {
        font-weight: 600;
        margin-bottom: 8px;
      }
      .rating-prompt .rp-actions {
        display: flex;
        gap: 6px;
      }
      .rating-prompt .rp-actions button {
        flex: 1;
        padding: 6px 8px;
        font-size: 12px;
        background: #fff;
        color: #333;
        border: 1px solid #cbd2dc;
      }
      .rating-prompt .rp-actions button:hover {
        background: #eef2f7;
      }
      .rating-prompt .rp-dismiss {
        position: absolute;
        top: 4px;
        right: 6px;
        width: auto;
        padding: 0 4px;
        background: transparent;
        color: #888;
        font-size: 14px;
        line-height: 1;
        border: none;
      }
      .rating-prompt .rp-dismiss:hover {
        background: transparent;
        color: #333;
      }
      .diag {
        margin-top: 12px;
        text-align: center;
      }
      .diag-link {
        background: none;
        border: none;
        color: #888;
        font-size: 11px;
        text-decoration: underline;
        cursor: pointer;
        padding: 2px 4px;
        width: auto;
      }
      .diag-link:hover {
        color: #2196f3;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <h1>
      <img src="icon48.png" alt="MD" class="logo" />
      <span id="extensionName"></span>
      <span id="version" class="version"></span>
    </h1>
    <button id="saveBtn"></button>

    <div id="ratingPrompt" class="rating-prompt" hidden>
      <button id="rpDismiss" class="rp-dismiss" aria-label="Dismiss">×</button>
      <div id="rpTitle" class="rp-title">Enjoying Markdown Printer?</div>
      <div id="rpActions" class="rp-actions">
        <button id="rpYes" type="button">👍 Yes</button>
        <button id="rpNo" type="button">👎 Not really</button>
      </div>
    </div>

    <div class="diag">
      <button id="diagBtn" class="diag-link" type="button">Copy diagnostics</button>
    </div>

    <div class="copyright">
      © <a href="https://lev.engineer" target="_blank">Lev Gelfenbuim</a> 2025
    </div>
    <script src="log-buffer.js"></script>
    <script src="logger.js"></script>
    <script src="rating-policy.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
